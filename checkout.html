<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="香悅個人服務結帳展示，填寫資料並檢視優惠與付款方式。">
  <title>線上結帳｜香悅｜天使姐姐</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="modules.css">
</head>
<body>
  <div id="siteHeader"></div>
  <main>
    <section class="page-hero compact"><div class="container"><p class="eyebrow">CHECKOUT</p><h1>完成服務訂購</h1><p>這是購物流程展示版；送出訂單不會扣款，填寫資料也不會傳送到網路。</p></div></section>
    <section class="module module--transaction"><div class="container checkout-layout">
      <form class="checkout-form" id="checkoutForm"><h2>訂購資訊</h2><label><span>姓名</span><input type="text" name="customerName" autocomplete="name" required placeholder="請輸入姓名"></label><label><span>Email</span><input type="email" name="customerEmail" autocomplete="email" required placeholder="name@example.com"></label><label><span>聯絡電話</span><input type="tel" name="phone" autocomplete="tel" required placeholder="09xx-xxx-xxx"></label><fieldset><legend>付款方式</legend><label><input type="radio" name="payment" value="credit" checked> 信用卡</label><label><input type="radio" name="payment" value="transfer"> ATM 轉帳</label><label><input type="radio" name="payment" value="linepay"> LINE Pay</label></fieldset><label><span>備註</span><textarea name="note" rows="4" placeholder="例如：偏好的預約時段或想先讓老師知道的事項"></textarea></label><p class="demo-note">目前為展示流程。完成後請透過 LINE 確認服務形式與時段。</p><button class="button primary" type="submit">送出示意訂單</button></form>
      <aside class="order-summary checkout-summary"><p class="eyebrow">YOUR ORDER</p><div id="checkoutItems" class="mini-cart"></div><div class="summary-row"><span>商品原價</span><strong id="checkoutSubtotal">NT$ 0</strong></div><div class="summary-row"><span>優惠折扣</span><strong id="checkoutDiscount">NT$ 0</strong></div><div class="summary-row total"><span>訂單總額</span><strong id="checkoutTotal">NT$ 0</strong></div><a class="button secondary" href="cart.html">返回購物車</a></aside>
    </div></section>
  </main>
  <div id="siteFooter"></div>
  <script src="script.js"></script>
</body>
</html>
